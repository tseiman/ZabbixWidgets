zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: 8e155e663e5c4a3f93a765d6c30b70cd
    template: Proxmox Backup Server by HTTP
    name: Proxmox Backup Server by HTTP
    description: 'Template for monitoring Proxmox Backup Server (PBS) via its HTTP API.


      It collects datastore usage, disk health and wearout, failed task

      information and per-backup-group snapshot freshness across all

      namespaces through the PBS REST API, and discovers datastores, disks

      and backup groups via low-level discovery.


      Setup:

      Create a monitoring user and an API token with at least the "Audit" role

      on path "/", then set the {$PBS.HOST}, {$PBS.TOKEN.ID} and

      {$PBS.TOKEN.SECRET} macros on the host.


      API documentation: https://pbs.proxmox.com/docs/api-viewer/index.html


      Template author: nikosch86

      Source and issue tracker: https://github.com/nikosch86/zabbix-proxmox-backup-server

      '
    groups:
    - name: Templates/Applications
    items:
    - uuid: 0449b6e2a6ae4e40860479b234035718
      name: 'PBS: API service status'
      type: SCRIPT
      key: pbs.api.available
      delay: 5m
      history: 7d
      params: "try {\n  var params = JSON.parse(value);\n  var req = new HttpRequest();\n  req.addHeader('Authorization: PBSAPIToken='\
        \ + params.token + ':' + params.secret);\n  req.get(encodeURI('https://' + params.host + ':' + params.port + '/api2/json/version'));\n\
        } catch (error) {\n    Zabbix.log(3, \"Proxmox Backup Server API failed: \" + params.host + \" Error: \" + error);\n\
        \    if (!Number.isInteger(error))\n        return 520;\n}\nreturn req.getStatus();\n"
      description: Get API service status.
      valuemap:
        name: HTTP response status code
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      timeout: 10s
      parameters:
      - name: host
        value: '{$PBS.HOST}'
      - name: port
        value: '{$PBS.PORT}'
      - name: secret
        value: '{$PBS.TOKEN.SECRET}'
      - name: token
        value: '{$PBS.TOKEN.ID}'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: c824c9e2069b4566b4c0d41d5ae7266e
        expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200
        name: 'PBS: API service not available'
        priority: HIGH
        description: The API service is not available. Check the network connection, the PBS service status and the API token
          authorization settings.
    - uuid: 430dbc8869df4f5a9083055812c4c85a
      name: 'PBS: Get backup groups'
      type: SCRIPT
      key: pbs.backupgroups
      delay: '{$PBS.SNAPSHOT.INTERVAL}'
      history: 1d
      value_type: TEXT
      params: "var params = JSON.parse(value);\nvar base = 'https://' + params.host + ':' + params.port + '/api2/json';\n\
        var req = new HttpRequest();\nreq.addHeader('Authorization: PBSAPIToken=' + params.token + ':' + params.secret);\n\
        \nvar resp = req.get(encodeURI(base + '/status/datastore-usage'));\nif (req.getStatus() !== 200) {\n    throw 'Failed\
        \ to list datastores: HTTP status ' + req.getStatus();\n}\n\nfunction nsSuffix(ns) {\n    return ns ? '/' + ns : '';\n\
        }\n\nvar result = [];\n(JSON.parse(resp).data || []).forEach(function (store) {\n    if (store.error) {\n        return;\n\
        \    }\n\n    // Enumerate namespaces recursively. Root (empty string) is always\n    // included; sub-namespaces\
        \ come from the namespace endpoint. If the\n    // endpoint is unavailable (older PBS or a permission issue) the\n\
        \    // template falls back to monitoring the root namespace only.\n    var namespaces = [''];\n    try {\n      \
        \  var nsResp = req.get(encodeURI(base + '/admin/datastore/' + store.store + '/namespace'));\n        if (req.getStatus()\
        \ === 200) {\n            (JSON.parse(nsResp).data || []).forEach(function (item) {\n                if (item.ns &&\
        \ namespaces.indexOf(item.ns) === -1) {\n                    namespaces.push(item.ns);\n                }\n      \
        \      });\n        } else {\n            Zabbix.log(4, 'PBS namespace list failed for datastore ' + store.store +\
        \ ': HTTP status ' + req.getStatus() + ' (monitoring root namespace only)');\n        }\n    } catch (error) {\n \
        \       Zabbix.log(4, 'PBS namespace enumeration error for datastore ' + store.store + ': ' + error + ' (monitoring\
        \ root namespace only)');\n    }\n\n    namespaces.forEach(function (ns) {\n        var groupUrl = encodeURI(base\
        \ + '/admin/datastore/' + store.store + '/groups');\n        if (ns) {\n            groupUrl += '?ns=' + encodeURIComponent(ns);\n\
        \        }\n        var groupResp = req.get(groupUrl);\n        if (req.getStatus() !== 200) {\n            Zabbix.log(3,\
        \ 'PBS group list failed for datastore ' + store.store + ' namespace \"' + ns + '\": HTTP status ' + req.getStatus());\n\
        \            return;\n        }\n        (JSON.parse(groupResp).data || []).forEach(function (group) {\n         \
        \   if (!(group['last-backup'] > 0)) {\n                return;\n            }\n            result.push({\n      \
        \          datastore: store.store,\n                ns: ns,\n                ns_suffix: nsSuffix(ns),\n          \
        \      group: group['backup-type'] + '/' + group['backup-id'],\n                type: group['backup-type'],\n    \
        \            id: group['backup-id'],\n                last: group['last-backup'],\n                comment: group.comment\
        \ || ''\n            });\n        });\n    });\n});\nreturn JSON.stringify(result);\n"
      description: 'Backup groups and their latest snapshot time (last-backup), across all

        datastores and all namespaces, from the per-datastore groups endpoint.

        Namespaces are enumerated recursively via the namespace endpoint; the

        root namespace is always included. One entry per backup group is stored

        per poll, including the namespace and the group comment so that freshness

        alerting can be suppressed for intentionally-retained groups (for example

        the leftover backups of a VM/CT that was deleted at the source). Datastores

        that report an error or cannot be queried are skipped; their freshness

        items keep their last known value until the datastore recovers (the

        datastore error trigger covers that condition).

        '
      timeout: 30s
      parameters:
      - name: host
        value: '{$PBS.HOST}'
      - name: port
        value: '{$PBS.PORT}'
      - name: secret
        value: '{$PBS.TOKEN.SECRET}'
      - name: token
        value: '{$PBS.TOKEN.ID}'
      tags:
      - tag: component
        value: raw
    - uuid: ddea6e9d77c04fedb237d1bf72d22778
      name: 'PBS: Get datastore status'
      type: HTTP_AGENT
      key: pbs.datastore.status
      delay: 5m
      history: 7d
      value_type: TEXT
      description: Get datastore status.
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: CUSTOM_VALUE
        error_handler_params: Error getting data
      - type: JSONPATH
        parameters:
        - $.body.data
      timeout: 10s
      url: https://{$PBS.HOST}:{$PBS.PORT}/api2/json/status/datastore-usage
      headers:
      - name: Authorization
        value: PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}
      output_format: JSON
      verify_peer: 'YES'
      verify_host: 'YES'
      tags:
      - tag: component
        value: raw
    - uuid: 83c76592aedf4833a63393b5e7b54fb9
      name: 'PBS: Get disks'
      type: HTTP_AGENT
      key: pbs.disks
      delay: 5m
      history: 7d
      value_type: TEXT
      description: Get disks.
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: CUSTOM_VALUE
        error_handler_params: Error getting data
      - type: JSONPATH
        parameters:
        - $.body.data
      timeout: 10s
      url: https://{$PBS.HOST}:{$PBS.PORT}/api2/json/nodes/localhost/disks/list
      headers:
      - name: Authorization
        value: PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}
      output_format: JSON
      verify_peer: 'YES'
      verify_host: 'YES'
      tags:
      - tag: component
        value: raw
    - uuid: 17e7c9ee749946aaaf19ae4f1148f0d1
      name: 'PBS: Get failed tasks'
      type: SCRIPT
      key: pbs.tasks.error
      delay: 5m
      history: 7d
      value_type: TEXT
      params: "var p = JSON.parse(value);\nvar req = new HttpRequest();\nreq.addHeader('Authorization: PBSAPIToken=' + p.token\
        \ + ':' + p.secret);\n\nvar base = 'https://' + p.host + ':' + p.port + '/api2/json';\nvar days = Number('{$PBS.TASKS.DAYS}');\n\
        if (!isFinite(days) || days <= 0) { throw 'Invalid PBS.TASKS.DAYS'; }\nvar since = Math.floor(Date.now() / 1000) -\
        \ days * 86400;\n\nfunction get(path) {\n    var response = req.get(base + path);\n    if (req.getStatus() !== 200)\
        \ { throw 'PBS task query failed: HTTP ' + req.getStatus(); }\n    var data = JSON.parse(response).data;\n    if (data\
        \ === undefined || data === null) { throw 'Missing task data'; }\n    return data;\n}\n\nfunction taskList(query)\
        \ {\n    var result = [];\n    for (var page = 0; page < 100; page++) {\n        var batch = get('/nodes/0/tasks?running=false&since='\
        \ + since + '&limit=100&start=' + page * 100 + query);\n        if (!Array.isArray(batch)) { throw 'Invalid task response';\
        \ }\n        result = result.concat(batch);\n        if (batch.length < 100) { return result; }\n    }\n    throw\
        \ 'Incomplete task history';\n}\n\nvar failures = taskList('&errors=true&statusfilter=error&statusfilter=warning');\n\
        var updates = taskList('&typefilter=aptupdate');\nvar backups = taskList('&typefilter=backup');\nvar completed = updates.concat(backups);\n\
        \nfailures = failures.filter(function(task) {\n    if (task.starttime < since || task.status === 'OK') { return false;\
        \ }\n    if (task.worker_type !== 'aptupdate' && task.worker_type !== 'backup') { return true; }\n\n    // Ohne Backup-Kennung\
        \ keine automatische Entwarnung.\n    if (task.worker_type === 'backup' && !task.worker_id) { return true; }\n\n \
        \   return !completed.some(function(done) {\n        return done.worker_type === task.worker_type &&\n           \
        \ done.status === 'OK' &&\n            done.endtime > 0 &&\n            done.starttime > (task.endtime || task.starttime)\
        \ &&\n            done.node === task.node &&\n            (done.worker_id || '') === (task.worker_id || '');\n   \
        \ });\n});\n\nreturn JSON.stringify(failures);\n"
      description: 'Failed tasks within PBS.TASKS.DAYS. Only aptupdate warnings/errors are superseded by a later completed
        successful aptupdate on the same node and worker. All backup, verify, prune, GC, sync and other errors retain the
        full lookback. Paginated task queries; incomplete/API failures do not yield an empty healthy list. Local customization:
        TS aptupdate recovery.'
      timeout: 30s
      parameters:
      - name: host
        value: '{$PBS.HOST}'
      - name: port
        value: '{$PBS.PORT}'
      - name: secret
        value: '{$PBS.TOKEN.SECRET}'
      - name: token
        value: '{$PBS.TOKEN.ID}'
      tags:
      - tag: component
        value: raw
    - uuid: 2c1882c1b4ad475e961922283a62ef2a
      name: 'PBS: Failed other tasks'
      type: DEPENDENT
      key: pbs.tasks.error.other
      history: 7d
      value_type: TEXT
      description: Failed tasks within the last {$PBS.TASKS.DAYS} days whose worker type is not covered by the per-worktype
        items (backup, garbage collection, prune, sync, verify).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var prefixes = ['backup', 'garbage_collection', 'prune', 'sync', 'verif', 'termproxy'];\nvar result = [];\nvar\
          \ tasks = JSON.parse(value);\nif (tasks instanceof Array) {\n    tasks.forEach(function (task) {\n        var type\
          \ = String(task.worker_type || '');\n        var matched = false;\n        for (var i = 0; i < prefixes.length;\
          \ i++) {\n            if (type.indexOf(prefixes[i]) === 0) {\n                matched = true;\n                break;\n\
          \            }\n        }\n        if (!matched) {\n            result.push(task);\n        }\n    });\n}\nreturn\
          \ JSON.stringify(result);\n"
      master_item:
        key: pbs.tasks.error
      tags:
