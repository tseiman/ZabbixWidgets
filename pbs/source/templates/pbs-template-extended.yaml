            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200
      - uuid: 3a781863820548b78994156dff6b5175
        name: 'PBS: Disk [{#DISK.PATH}] Vendor'
        type: DEPENDENT
        key: pbs.disk.vendor[{#DISK.PATH}]
        history: 90d
        value_type: TEXT
        description: Vendor of the disk.
        preprocessing:
        - type: JSONPATH
          parameters:
