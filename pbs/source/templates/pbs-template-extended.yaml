        tags:
        - tag: component
          value: storage
        - tag: datastore
          value: '{#DATASTORE.NAME}'
      master_item:
        key: pbs.datastore.status
      lld_macro_paths:
      - lld_macro: '{#DATASTORE.NAME}'
        path: $.store
    - uuid: 4333aa3a0ee64fe8aede5e835d63923d
