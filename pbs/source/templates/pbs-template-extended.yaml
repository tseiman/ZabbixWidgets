    - uuid: 9229736002e6461cadcc19a926fb6a95
      name: 'PBS dashboard: Running tasks'
      type: SCRIPT
      key: pbs.dashboard.tasks.running
      delay: 1m
      history: 1d
      value_type: TEXT
      params: "var p = JSON.parse(value);\nvar req = new HttpRequest();\nreq.addHeader('Authorization: PBSAPIToken=' + p.token\
        \ + ':' + p.secret);\nvar base = 'https://' + p.host + ':' + p.port + '/api2/json';\nvar permissions = req.get(base\
        \ + '/access/permissions?path=/system/tasks');\nif (req.getStatus() !== 200) { throw 'Cannot verify task audit permissions:\
        \ HTTP ' + req.getStatus(); }\nvar acl = JSON.parse(permissions).data;\nif (!acl || !acl['/system/tasks'] || !Object.prototype.hasOwnProperty.call(acl['/system/tasks'],\
        \ 'Sys.Audit')) { throw 'Sys.Audit on /system/tasks required; refusing partial per-user task list'; }\nvar response\
        \ = req.get(base + '/nodes/localhost/tasks?running=true&limit=0');\nif (req.getStatus() !== 200) { throw 'PBS running\
        \ query: HTTP ' + req.getStatus(); }\nvar tasks = JSON.parse(response).data;\nif (!Array.isArray(tasks)) { throw 'Invalid\
        \ running task list'; }\ntasks = tasks.filter(function(t) { return !t.endtime; }).map(function(t) {\n    if (!t.upid\
        \ || !t.worker_type || !isFinite(t.starttime)) { throw 'Invalid running task'; }\n    return {upid: t.upid, worker_type:\
        \ t.worker_type, worker_id: t.worker_id || '', starttime: Number(t.starttime), node: t.node || ''};\n});\nvar result\
        \ = JSON.stringify({version: 1, until: Math.floor(Date.now() / 1000), tasks: tasks});\nvar size = 0;\nfor (var i =\
        \ 0; i < result.length; i++) { size += result.charCodeAt(i) < 127 ? 1 : 6; }\nif (size > 60000) { throw 'Running task\
        \ list exceeds 60000 bytes'; }\nreturn result;\n"
      timeout: 30s
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      tags:
      - tag: component
        value: pbs-dashboard
    discovery_rules:
    - uuid: de800b33f3054bb5a49d5e68f4c7851a
      name: 'PBS: Backup group discovery'
      type: DEPENDENT
      key: pbs.backupgroup.discovery
      lifetime: '{$PBS.LLD.KEEP.LOST}'
      enabled_lifetime_type: DISABLE_AFTER
      enabled_lifetime: '{$PBS.LLD.DISABLE.LOST}'
      description: 'Discovers the backup groups (backup-type/backup-id, e.g. host/myclient)

        that have at least one snapshot in any datastore and any namespace,

        including the root namespace. Each discovered entity is identified by

        datastore, namespace and group, so the same group name in different

        namespaces is tracked separately.

        Note: a client that has never produced a single snapshot is not

        discovered and therefore not monitored for freshness.

        '
      item_prototypes:
      - uuid: e41c4d860873477a97611b98bb8ca60e
        name: 'PBS: Backup group [{#DATASTORE.NAME}{#BACKUP.NAMESPACE.SUFFIX}/{#BACKUP.GROUP}] Last Snapshot Age'
        type: DEPENDENT
        key: pbs.backupgroup.lastsnapshot.age[{#DATASTORE.NAME},{#BACKUP.NAMESPACE},{#BACKUP.GROUP}]
        history: 90d
        units: s
        description: 'Seconds since the most recent snapshot of backup group {#BACKUP.GROUP}

          in datastore {#DATASTORE.NAME}{#BACKUP.NAMESPACE.SUFFIX}. An empty

          namespace suffix denotes the datastore''s root namespace.

          For datastores filled by a sync job the snapshots keep the original

          backup-time of the source, so on the sync target this measures

          end-to-end freshness (client backup plus sync).

          '
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.datastore == '{#DATASTORE.NAME}' && @.ns == '{#BACKUP.NAMESPACE}' && @.group == '{#BACKUP.GROUP}')].last.first()
          error_handler: DISCARD_VALUE
        - type: JAVASCRIPT
          parameters:
          - return Math.max(0, Math.floor(Date.now() / 1000) - value);
        master_item:
          key: pbs.backupgroups
        tags:
        - tag: backup_group
          value: '{#BACKUP.GROUP}'
        - tag: component
          value: backup-freshness
        - tag: datastore
          value: '{#DATASTORE.NAME}'
        - tag: namespace
          value: '{#BACKUP.NAMESPACE}'
        trigger_prototypes:
        - uuid: 9d4d36649a1e4728839bcdf313f77e6f
          expression: last(/Proxmox Backup Server by HTTP/pbs.backupgroup.lastsnapshot.age[{#DATASTORE.NAME},{#BACKUP.NAMESPACE},{#BACKUP.GROUP}])>{$PBS.SNAPSHOT.AGE.HIGH:"{#BACKUP.GROUP}"}
          name: 'PBS: Backup group [{#DATASTORE.NAME}{#BACKUP.NAMESPACE.SUFFIX}/{#BACKUP.GROUP}] last snapshot older than
            high threshold'
          priority: HIGH
          description: The most recent snapshot of backup group [{#BACKUP.GROUP}] in datastore [{#DATASTORE.NAME}{#BACKUP.NAMESPACE.SUFFIX}]
            is older than {$PBS.SNAPSHOT.AGE.HIGH:"{#BACKUP.GROUP}"}. The client backup job has not produced a new snapshot
            for an extended period; check the client and its backup schedule. If the source VM/CT was deleted, add the {$PBS.SNAPSHOT.IGNORE.COMMENT}
            marker to the group comment in PBS to stop monitoring its freshness; this already-open problem then clears only
            after the rule's lost-resource period, so suppress it to silence sooner (see the template description).
          manual_close: 'YES'
          dependencies:
          - name: 'PBS: API service not available'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200
        - uuid: ad372da28008485da184353c2922f644
          expression: last(/Proxmox Backup Server by HTTP/pbs.backupgroup.lastsnapshot.age[{#DATASTORE.NAME},{#BACKUP.NAMESPACE},{#BACKUP.GROUP}])>{$PBS.SNAPSHOT.AGE.WARN:"{#BACKUP.GROUP}"}
          name: 'PBS: Backup group [{#DATASTORE.NAME}{#BACKUP.NAMESPACE.SUFFIX}/{#BACKUP.GROUP}] last snapshot older than
            warning threshold'
          priority: WARNING
          description: The most recent snapshot of backup group [{#BACKUP.GROUP}] in datastore [{#DATASTORE.NAME}{#BACKUP.NAMESPACE.SUFFIX}]
            is older than {$PBS.SNAPSHOT.AGE.WARN:"{#BACKUP.GROUP}"}. A recent client backup run may have failed or been skipped.
            If the source VM/CT was deleted, add the {$PBS.SNAPSHOT.IGNORE.COMMENT} marker to the group comment in PBS to
            stop monitoring its freshness; this already-open problem then clears only after the rule's lost-resource period,
            so suppress it to silence sooner (see the template description).
          manual_close: 'YES'
          dependencies:
          - name: 'PBS: API service not available'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200
          - name: 'PBS: Backup group [{#DATASTORE.NAME}{#BACKUP.NAMESPACE.SUFFIX}/{#BACKUP.GROUP}] last snapshot older than
              high threshold'
            expression: last(/Proxmox Backup Server by HTTP/pbs.backupgroup.lastsnapshot.age[{#DATASTORE.NAME},{#BACKUP.NAMESPACE},{#BACKUP.GROUP}])>{$PBS.SNAPSHOT.AGE.HIGH:"{#BACKUP.GROUP}"}
      master_item:
        key: pbs.backupgroups
      lld_macro_paths:
      - lld_macro: '{#BACKUP.COMMENT}'
        path: $.comment
      - lld_macro: '{#BACKUP.GROUP}'
        path: $.group
      - lld_macro: '{#BACKUP.ID}'
        path: $.id
      - lld_macro: '{#BACKUP.NAMESPACE.SUFFIX}'
        path: $.ns_suffix
      - lld_macro: '{#BACKUP.NAMESPACE}'
        path: $.ns
      - lld_macro: '{#BACKUP.TYPE}'
        path: $.type
      - lld_macro: '{#DATASTORE.NAME}'
        path: $.datastore
      overrides:
      - name: No freshness triggers for comment-marked backup groups
        step: '1'
        filter:
          conditions:
          - macro: '{#BACKUP.COMMENT}'
            value: '{$PBS.SNAPSHOT.IGNORE.COMMENT}'
        operations:
        - operationobject: TRIGGER_PROTOTYPE
          operator: LIKE
          value: last snapshot older than
          discover: NO_DISCOVER
    - uuid: 5eec729d0e1c4e529cdc884a6c5887db
      name: 'PBS: Datastore discovery'
      type: DEPENDENT
      key: pbs.datastore.discovery
      lifetime: '{$PBS.LLD.KEEP.LOST}'
      enabled_lifetime_type: DISABLE_AFTER
      enabled_lifetime: '{$PBS.LLD.DISABLE.LOST}'
      description: Discovers the datastores configured on the Proxmox Backup Server from the datastore-usage endpoint.
      item_prototypes:
      - uuid: 60f2c0498c414dfdab7e80cc7ea2985b
        name: 'PBS: Datastore [{#DATASTORE.NAME}] Available Size'
        type: DEPENDENT
        key: pbs.datastore.available[{#DATASTORE.NAME}]
        history: 90d
        units: bytes
        description: Available size of datastore in bytes.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.store == '{#DATASTORE.NAME}')].avail.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: pbs.datastore.status
        tags:
        - tag: component
          value: storage
        - tag: datastore
          value: '{#DATASTORE.NAME}'
        trigger_prototypes:
        - uuid: 79b3b6148288487f86d596ffdce93434
          expression: 'min(/Proxmox Backup Server by HTTP/pbs.datastore.available[{#DATASTORE.NAME}],15m)<

            {$PBS.DATASTORE.AVAILABLE.MIN:"{#DATASTORE.NAME}"}

            '
          name: 'PBS: Datastore [{#DATASTORE.NAME}] Available Size'
          priority: HIGH
          description: Datastore [{#DATASTORE.NAME}] has less than {$PBS.DATASTORE.AVAILABLE.MIN:"{#DATASTORE.NAME}"} bytes
            available.
          dependencies:
          - name: 'PBS: API service not available'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200
      - uuid: 75d30b86c1234fb08f90b5f6cbe958af
        name: 'PBS: Datastore [{#DATASTORE.NAME}] Error'
        type: DEPENDENT
        key: pbs.datastore.error[{#DATASTORE.NAME}]
        history: 90d
        value_type: TEXT
        description: Error status of datastore.
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.store == '{#DATASTORE.NAME}')].error.first()
          error_handler: CUSTOM_VALUE
          error_handler_params: No Error
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: pbs.datastore.status
        tags:
        - tag: component
          value: storage
        - tag: datastore
          value: '{#DATASTORE.NAME}'
        trigger_prototypes:
        - uuid: b9adc2dcab1f417ea18bcbfceadfb725
          expression: find(/Proxmox Backup Server by HTTP/pbs.datastore.error[{#DATASTORE.NAME}],,"like","No Error")=0
          name: 'PBS: Datastore [{#DATASTORE.NAME}] Error'
          priority: HIGH
          description: Datastore [{#DATASTORE.NAME}] is reporting an error!
          dependencies:
          - name: 'PBS: API service not available'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200
      - uuid: a75f614f0bfa43b6b2c6d70456098dad
        name: 'PBS: Datastore [{#DATASTORE.NAME}] Estimated Full Date'
        type: DEPENDENT
        key: pbs.datastore.estimatedfulldate[{#DATASTORE.NAME}]
        history: 90d
        value_type: TEXT
        description: 'Estimation of the Date Time Stamp when the storage will be full.

          It''s calculated via a simple Linear Regression (Least Squares) over the RRD data of the

          last Month. Missing if not enough data points are available yet. An estimate in the past

          means that usage is declining or not changing.

          The value is discarded when PBS reports no estimate, for example when not

          enough data points exist or for removable/offline datastores (PBS 4.x).

          '
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.store == '{#DATASTORE.NAME}')].['estimated-full-date'].first()
          error_handler: DISCARD_VALUE
        - type: JAVASCRIPT
          parameters:
          - 'var current_unixtime = Math.floor(Date.now() / 1000);

            var delta = value - current_unixtime;

            if (delta < 0) return "Never";

            return new Date(value * 1000);

            '
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: pbs.datastore.status
        tags:
        - tag: component
          value: storage
        - tag: datastore
          value: '{#DATASTORE.NAME}'
      - uuid: 1bb5ff8c93604d188b85e91006e3987f
        name: 'PBS: Datastore [{#DATASTORE.NAME}] Estimated Seconds to Full'
        type: DEPENDENT
        key: pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}]
        history: 90d
        units: s
        description: 'Estimated number of seconds until the datastore is full.

          It''s calculated via a simple Linear Regression (Least Squares) over the RRD data of the

          last Month. Missing if not enough data points are available yet. An estimate in the past

          means that usage is declining or not changing.

          The value is discarded when PBS reports no estimate, for example when not

          enough data points exist or for removable/offline datastores (PBS 4.x).

          '
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.store == '{#DATASTORE.NAME}')].['estimated-full-date'].first()
          error_handler: DISCARD_VALUE
        - type: JAVASCRIPT
          parameters:
          - 'var current_unixtime = Math.floor(Date.now() / 1000);

            var delta = Math.max(0, (value - current_unixtime));

            return delta;

            '
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: pbs.datastore.status
        tags:
        - tag: component
          value: storage
        - tag: datastore
          value: '{#DATASTORE.NAME}'
        trigger_prototypes:
        - uuid: 48c8a3296a0d49e5b000646527a9906d
          expression: max(/Proxmox Backup Server by HTTP/pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}],15m)<2419200
            and min(/Proxmox Backup Server by HTTP/pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}],15m)>0
          name: 'PBS: Datastore [{#DATASTORE.NAME}] filling up within one month'
          priority: WARNING
          description: Datastore [{#DATASTORE.NAME}] is projected to fill within one month.
          dependencies:
          - name: 'PBS: API service not available'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200
          - name: 'PBS: Datastore [{#DATASTORE.NAME}] filling up within one week'
            expression: max(/Proxmox Backup Server by HTTP/pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}],15m)<604800
              and min(/Proxmox Backup Server by HTTP/pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}],15m)>0
        - uuid: f8899123a86144a0a306a77143c681cb
          expression: max(/Proxmox Backup Server by HTTP/pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}],15m)<604800
            and min(/Proxmox Backup Server by HTTP/pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}],15m)>0
          name: 'PBS: Datastore [{#DATASTORE.NAME}] filling up within one week'
          priority: HIGH
          description: Datastore [{#DATASTORE.NAME}] is projected to fill within one week.
          dependencies:
          - name: 'PBS: API service not available'
            expression: last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200
      - uuid: 980e2da86ba74e5c9ca85b1ac308352d
        name: 'PBS: Datastore [{#DATASTORE.NAME}] Estimated Time to Full'
        type: DEPENDENT
        key: pbs.datastore.estimatedtimetofull[{#DATASTORE.NAME}]
        history: 90d
        value_type: TEXT
        description: 'Estimation of the Time until the storage will be full.

          It''s calculated via a simple Linear Regression (Least Squares) over the RRD data of the

          last Month. Missing if not enough data points are available yet. An estimate in the past

          means that usage is declining or not changing.

          The value is discarded when PBS reports no estimate, for example when not

          enough data points exist or for removable/offline datastores (PBS 4.x).

          '
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.store == '{#DATASTORE.NAME}')].['estimated-full-date'].first()
          error_handler: DISCARD_VALUE
        - type: JAVASCRIPT
          parameters:
          - 'var current_unixtime = Math.floor(Date.now() / 1000);

            var delta = value - current_unixtime;

            if (delta < 0) return "Never";


            var days = Math.floor(delta / 86400);

            delta -= days * 86400;


            var hours = Math.floor(delta / 3600) % 24;

            delta -= hours * 3600;


            var minutes = Math.floor(delta / 60) % 60;

            delta -= minutes * 60;


            var seconds = Math.floor(delta % 60);


            return days+" Days "+hours+":"+minutes+":"+seconds+" (Hours:Minutes:Seconds)";

            '
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: pbs.datastore.status
        tags:
        - tag: component
          value: storage
        - tag: datastore
          value: '{#DATASTORE.NAME}'
      - uuid: ba568908143c4e87873dd1dd1b733283
        name: 'PBS: Datastore [{#DATASTORE.NAME}] Total Size'
        type: DEPENDENT
        key: pbs.datastore.total[{#DATASTORE.NAME}]
