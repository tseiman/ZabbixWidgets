          value: storage
        - tag: disk
          value: '{#DISK.PATH}'
      - uuid: 791a4b27bf53470cad24018548b2439d
        name: 'PBS: Disk [{#DISK.PATH}] Wearout'
        type: DEPENDENT
        key: pbs.disk.wearout[{#DISK.PATH}]
        history: 90d
        value_type: FLOAT
        units: '%'
        description: 'Disk wearout reported by PBS, as a percentage.

          Note: the direction of this value (whether a higher number means more or

          less wear) is SSD-model dependent and not standardized across vendors.

          The value is discarded for disks that do not report numeric wearout data.

          '
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.devpath == '{#DISK.PATH}')].wearout.first()
        - type: JAVASCRIPT
          parameters:
          - "var n = parseFloat(value);\nif (isNaN(n)) {\n    throw 'No numeric wearout data reported for this disk';\n}\n\
            return n;\n"
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        master_item:
          key: pbs.disks
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK.PATH}'
      master_item:
        key: pbs.disks
      lld_macro_paths:
      - lld_macro: '{#DISK.NAME}'
        path: $.name
      - lld_macro: '{#DISK.PATH}'
        path: $.devpath
      - lld_macro: '{#DISK.SERIAL}'
        path: $.serial
      - lld_macro: '{#DISK.SIZE}'
        path: $.size
      - lld_macro: '{#DISK.STATUS}'
        path: $.status
      - lld_macro: '{#DISK.TYPE}'
        path: $.['disk-type']
      - lld_macro: '{#DISK.USED}'
        path: $.used
      - lld_macro: '{#DISK.VENDOR}'
        path: $.vendor
      - lld_macro: '{#DISK.WEAROUT}'
        path: $.wearout
      overrides:
      - name: No wearout item for disks without numeric wearout
        step: '1'
        filter:
          conditions:
          - macro: '{#DISK.WEAROUT}'
            value: ^[0-9.]+$
            operator: NOT_MATCHES_REGEX
        operations:
        - operator: LIKE
          value: Wearout
          discover: NO_DISCOVER
    macros:
    - macro: '{$PBS.DATASTORE.AVAILABLE.MIN}'
      value: '10737418240'
      description: Minimum available space in a datastore, in bytes (defaults to 10 GiB). Can be overridden per datastore
        using the {#DATASTORE.NAME} macro context.
    - macro: '{$PBS.HOST}'
      value: <SET PBS HOSTNAME>
      description: Hostname or IP address of the PBS server API endpoint. Must be set on the host.
    - macro: '{$PBS.LLD.DISABLE.LOST}'
      value: 1h
      description: Grace period after which a discovered datastore or backup-group item is disabled once its datastore/group
        no longer exists in PBS, instead of polling the gone resource and erroring for the full keep period. Must exceed the
        discovery interval; the default is ~4 LLD poll cycles, which debounces a single incomplete API poll. Does not apply
        to disk discovery.
    - macro: '{$PBS.LLD.KEEP.LOST}'
      value: 14d
      description: Period after which a no-longer-present, already-disabled discovered datastore or backup-group item is deleted
        from the host. Must exceed {$PBS.LLD.DISABLE.LOST}. Does not apply to disk discovery.
    - macro: '{$PBS.PORT}'
      value: '8007'
      description: The API uses the HTTPS protocol and the server listens on port 8007 by default.
    - macro: '{$PBS.SNAPSHOT.AGE.HIGH}'
      value: 50h
      description: Last-snapshot age of a backup group above which a HIGH severity trigger fires. Default suits a daily backup
        schedule. Can be overridden per backup group using the {#BACKUP.GROUP} macro context; the context matches by group
        name only, so the same group name in different namespaces shares one threshold.
    - macro: '{$PBS.SNAPSHOT.AGE.WARN}'
      value: 30h
      description: Last-snapshot age of a backup group above which a WARNING severity trigger fires. Default suits a daily
        backup schedule. Can be overridden per backup group using the {#BACKUP.GROUP} macro context; the context matches by
        group name only, so the same group name in different namespaces shares one threshold.
    - macro: '{$PBS.SNAPSHOT.IGNORE.COMMENT}'
      value: (?i)no-monitor
      description: 'Regular expression matched against a backup group''s comment; a match suppresses that group''s snapshot-freshness
        triggers (the age item is kept, only the triggers are dropped). Use it for groups whose source VM/CT was deleted but
        whose backups are intentionally retained: set the group comment in PBS (Datastore > Content > group > Edit comment)
        to include the marker. Defaults to matching the text "no-monitor".'
    - macro: '{$PBS.SNAPSHOT.INTERVAL}'
      value: 15m
      description: Polling interval of the backup group list used for snapshot freshness. Each poll lists every backup group
        of each datastore across all namespaces (one namespace-list call plus one groups call per namespace per datastore),
        so keep this interval moderate.
    - macro: '{$PBS.TASKS.DAYS}'
      value: '2'
      description: Age of tasks to consider when looking for failed tasks (days).
    - macro: '{$PBS.TOKEN.ID}'
      value: USER@REALM!TOKENID
      description: API tokens allow stateless access to most parts of the REST API by another system, software or API client.
    - macro: '{$PBS.TOKEN.SECRET}'
      type: SECRET_TEXT
      description: Secret key of the API token.
    - macro: '{$PBS.DASHBOARD.LOOKBACK.HOURS}'
      value: '48'
      description: Overlapping completion lookback (1..168 h). Default 48 h, collection every 5 minutes. PBS archive retention
        must exceed this; outages longer than this may cause gaps.
    valuemaps:
    - uuid: b4e066bfeb334388a8fb9f30ad844459
      name: HTTP response status code
      mappings:
      - value: '200'
        newvalue: OK
      - value: '301'
        newvalue: Moved Permanently
      - value: '400'
        newvalue: Bad Request
      - value: '401'
        newvalue: Unauthorized
      - value: '403'
        newvalue: Forbidden
      - value: '404'
        newvalue: Not Found
      - value: '405'
        newvalue: Method Not Allowed
      - value: '500'
        newvalue: Internal Server Error
      - value: '502'
        newvalue: Bad Gateway
      - value: '503'
        newvalue: Service Unavailable
      - value: '504'
        newvalue: Gateway Timeout
      - value: '520'
        newvalue: Unknown Error
