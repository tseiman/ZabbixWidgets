    - uuid: 570c104740ae4454b85c5d6f0e93f19d
      name: 'PBS dashboard: Collect completed tasks'
      type: SCRIPT
      key: pbs.dashboard.tasks.raw
      delay: 5m
      history: '0'
      value_type: TEXT
      params: "var p = JSON.parse(value);\nvar req = new HttpRequest();\nreq.addHeader('Authorization: PBSAPIToken=' + p.token\
        \ + ':' + p.secret);\nvar base = 'https://' + p.host + ':' + p.port + '/api2/json';\nvar permissions = req.get(base\
        \ + '/access/permissions?path=/system/tasks');\nif (req.getStatus() !== 200) { throw 'Cannot verify task audit permissions:\
        \ HTTP ' + req.getStatus(); }\nvar acl = JSON.parse(permissions).data;\nif (!acl || !acl['/system/tasks'] || !Object.prototype.hasOwnProperty.call(acl['/system/tasks'],\
        \ 'Sys.Audit')) { throw 'Sys.Audit on /system/tasks required; refusing partial per-user task list'; }\nvar now = Math.floor(Date.now()\
        \ / 1000);\nvar hours = Number(p.lookback);\nif (!isFinite(hours) || hours < 1 || hours > 168) { throw 'Dashboard\
        \ lookback must be 1..168 hours'; }\nvar since = now - hours * 3600;\n// No since filter: PBS also filters by START\
        \ time, losing long-running jobs.\n// limit=0 is the documented unbounded list, avoiding moving offset pagination.\n\
        var response = req.get(base + '/nodes/localhost/tasks?limit=0');\nif (req.getStatus() !== 200) { throw 'PBS task query:\
        \ HTTP ' + req.getStatus(); }\nif (response.length > 8000000) { throw 'PBS task archive exceeds 8 MB; use an incremental\
        \ collector'; }\nvar list = JSON.parse(response).data;\nif (!Array.isArray(list)) { throw 'Invalid task list'; }\n\
        var shards = [];\nfor (var i = 0; i < 16; i++) { shards.push({version: 1, since: since, until: now, tasks: []}); }\n\
        var seen = {};\nlist.forEach(function (t) {\n    if (!t.endtime || t.endtime < since || t.endtime > now) { return;\
        \ }\n    if (!t.upid || !t.worker_type || !isFinite(t.starttime) || t.starttime > t.endtime) { throw 'Invalid completed\
        \ task'; }\n    if (seen[t.upid]) { return; }\n    seen[t.upid] = true;\n    var hash = 0;\n    for (var j = 0; j\
        \ < t.upid.length; j++) { hash = ((hash * 31) + t.upid.charCodeAt(j)) >>> 0; }\n    shards[hash % 16].tasks.push({upid:\
        \ t.upid, node: t.node || '', worker_type: t.worker_type, worker_id: t.worker_id || '', starttime: Number(t.starttime),\
        \ endtime: Number(t.endtime), status: t.status || 'unknown'});\n});\nshards.forEach(function (s) {\n    // ASCII JSON\
        \ gives a reliable byte bound even for non-ASCII error messages.\n    var encoded = JSON.stringify(s);\n    var size\
        \ = 0;\n    for (var k = 0; k < encoded.length; k++) { size += encoded.charCodeAt(k) < 127 ? 1 : 6; }\n    if (size\
        \ > 60000) { throw 'Task shard exceeds 60000 bytes; lower lookback or use incremental ingestion'; }\n});\nreturn JSON.stringify({shards:\
        \ shards});\n"
      timeout: 60s
      parameters:
      - &id001
        name: host
        value: '{$PBS.HOST}'
      - &id002
        name: port
        value: '{$PBS.PORT}'
      - &id003
        name: token
        value: '{$PBS.TOKEN.ID}'
      - &id004
        name: secret
        value: '{$PBS.TOKEN.SECRET}'
