        master_item:
          key: unifi.devices.json
        tags:
        - tag: component
          value: topology-traffic
        - tag: direction
          value: rx
      - uuid: d6391ff219974746b4e75d2a6d690d2d
        name: 'UniFi device [{#UNIFI.NAME}]: TX direct rate'
