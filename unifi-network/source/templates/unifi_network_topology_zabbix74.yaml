      - uuid: d87e7ef159cb40248eaddbb48f5c0fd2
        name: 'UniFi device [{#UNIFI.NAME}]: RX counter-derived rate'
        type: DEPENDENT
        key: unifi.device.rx.counter.bps[{#UNIFI.MAC}]
        history: 30d
        value_type: FLOAT
        trends: 365d
        units: bps
        description: Fallback RX rate calculated from changes in the summed physical-port byte counters. The widget prefers
          the direct rate item when available.
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        master_item:
          key: unifi.device.rx.counter.bytes[{#UNIFI.MAC}]
        tags:
