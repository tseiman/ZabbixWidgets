zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: c2103f36d6e844049d89ce4a0a34dd26
    name: Templates/UniFi Topology
  templates:
  - uuid: dce62fc5d72144028ac50926dff3e713
    template: UniFi Network Topology
    name: UniFi Network Topology
    description: Standalone, read-only UniFi topology and per-device traffic collection for site default. Link alongside the
      existing UniFi Network API template on the controller host. Uses existing host macros; does not define or override them.
      Discovers switches and access points only to create aggregate RX/TX items; it does not change devices or create maps.
      TLS certificate and hostname verification are enabled.
    groups:
    - name: Templates/UniFi Topology
    items:
    - uuid: 23aece8c321342229e0a72077fd21248
      name: 'UniFi topology: Raw JSON'
      type: HTTP_AGENT
      key: unifi.topology.json
      delay: 1m
      history: 1d
      value_type: TEXT
      trends: '0'
      description: Read-only topology for site default. Uses existing host macros. Internal UniFi endpoint; response schema
        may change.
      timeout: 15s
      url: https://{$UNIFI_NETWORK_API_ADDRESS}/proxy/network/v2/api/site/default/topology
      status_codes: '200'
      follow_redirects: 'NO'
      headers:
      - name: X-API-Key
        value: '{$UNIFI_NETWORK_API_KEY}'
      retrieve_mode: BODY
      request_method: GET
      output_format: RAW
      verify_peer: 'YES'
      verify_host: 'YES'
      tags:
      - tag: component
        value: topology
    - uuid: 70dd8ac306c342ce8ff4afd5186d8c33
      name: 'UniFi topology: vertices JSON'
      type: DEPENDENT
      key: unifi.topology.vertices
      delay: '0'
      history: 1d
      value_type: TEXT
      trends: '0'
      description: Complete vertices array from the topology response.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.vertices
      master_item:
        key: unifi.topology.json
      tags:
      - tag: component
        value: topology
    - uuid: 2bc057c0dcb04aeabc120409f5391394
      name: 'UniFi topology: vertices count'
      type: DEPENDENT
      key: unifi.topology.vertices.count
      delay: '0'
      history: 30d
      value_type: UNSIGNED
      trends: 365d
      description: Number of entries in vertices; includes all types returned by UniFi. Not an online/health indicator. Missing
        or invalid data is not replaced by zero.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.vertices.length()
      master_item:
        key: unifi.topology.json
      tags:
      - tag: component
        value: topology
    - uuid: 3e5d2805017c4fe89911580fe6320c8e
      name: 'UniFi topology: edges JSON'
      type: DEPENDENT
      key: unifi.topology.edges
      delay: '0'
      history: 1d
      value_type: TEXT
      trends: '0'
      description: Complete edges array from the topology response.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.edges
      master_item:
        key: unifi.topology.json
      tags:
      - tag: component
        value: topology
    - uuid: 3d942b05284e483c9fa13e8ff7555478
      name: 'UniFi topology: edges count'
      type: DEPENDENT
      key: unifi.topology.edges.count
      delay: '0'
      history: 30d
      value_type: UNSIGNED
      trends: 365d
      description: Number of entries in edges; includes all types returned by UniFi. Not an online/health indicator. Missing
        or invalid data is not replaced by zero.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.edges.length()
      master_item:
        key: unifi.topology.json
      tags:
      - tag: component
        value: topology
    - uuid: 7f41966fe4cd490881db9a11c763bd7b
      name: 'UniFi devices: Raw JSON'
      type: HTTP_AGENT
      key: unifi.devices.json
      delay: 1m
      history: 1h
      value_type: TEXT
      trends: '0'
      description: Read-only device statistics for site default. Supplies per-port rates and counters for switch and access-point
        traffic items. Uses an internal UniFi Network endpoint whose response schema may change.
      timeout: 15s
      url: https://{$UNIFI_NETWORK_API_ADDRESS}/proxy/network/api/s/default/stat/device
      status_codes: '200'
      follow_redirects: 'NO'
      headers:
      - name: X-API-Key
        value: '{$UNIFI_NETWORK_API_KEY}'
      retrieve_mode: BODY
      request_method: GET
      output_format: RAW
      verify_peer: 'YES'
      verify_host: 'YES'
      tags:
      - tag: component
        value: topology-traffic
    discovery_rules:
    - uuid: f55d7a4f02d44cf89c03c26eed854b32
      name: 'UniFi devices: Switch and access point discovery'
      type: DEPENDENT
      key: unifi.device.discovery
      lifetime: 30d
      description: Discovers switches (usw) and access points (uap) with valid MAC addresses from the UniFi device statistics
        response.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |-
          var root = JSON.parse(value);
          var devices = Array.isArray(root) ? root : root.data;
          if (!Array.isArray(devices)) {
              throw 'UniFi device response has no data array.';
          }
          var seen = {};
          var result = [];
          devices.forEach(function (device) {
              var type = String(device.type || '').toLowerCase();
              var mac = String(device.mac || '').toLowerCase().replace(/-/g, ':');
              if ((type !== 'usw' && type !== 'uap')
                      || !/^(?:[0-9a-f]{2}:){5}[0-9a-f]{2}$/.test(mac) || seen[mac]) {
                  return;
              }
              seen[mac] = true;
              result.push({
                  '{#UNIFI.MAC}': mac,
                  '{#UNIFI.NAME}': String(device.name || mac),
                  '{#UNIFI.TYPE}': type
              });
          });
          return JSON.stringify(result);
      master_item:
        key: unifi.devices.json
      item_prototypes:
      - uuid: 82f7b959221343e586ff88d0d46aa425
        name: 'UniFi device [{#UNIFI.NAME}]: RX direct rate'
        type: DEPENDENT
        key: unifi.device.rx.rate.bps[{#UNIFI.MAC}]
        history: 30d
        value_type: FLOAT
        trends: 365d
        units: bps
        description: Sum of rx_bytes-r across unique physical ports, converted from bytes per second to bits per second. For
          an AP without usable port_table rates, the physical uplink rate is used. LAG/bond pseudo-interfaces and duplicate
          port indexes are excluded.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |-
            var wanted = '{#UNIFI.MAC}'.toLowerCase();
            var root = JSON.parse(value);
            var devices = Array.isArray(root) ? root : root.data;
            if (!Array.isArray(devices)) throw 'UniFi device response has no data array.';
            var device = devices.filter(function (row) {
                return String(row.mac || '').toLowerCase().replace(/-/g, ':') === wanted;
            })[0];
            if (!device) throw 'Discovered UniFi device is absent from the response.';
            function number(object, key) {
                var n = object && object[key] !== '' && object[key] !== null
                    ? Number(object[key]) : NaN;
                return isFinite(n) && n >= 0 ? n : null;
            }
            function physical(port) {
                var index = Number(port.port_idx !== undefined ? port.port_idx : port.num_port);
                var type = String(port.type || '').toLowerCase();
                var ifname = String(port.ifname || '').toLowerCase();
                return isFinite(index) && index >= 1
                    && !/(^|[-_])(lag|bond|aggregate)([-_]|$)/.test(type)
                    && !/^(lag|bond)/.test(ifname);
            }
            var seen = {}, sum = 0, count = 0;
            (Array.isArray(device.port_table) ? device.port_table : []).forEach(function (port) {
                if (!physical(port)) return;
                var index = String(Number(port.port_idx !== undefined ? port.port_idx : port.num_port));
                if (seen[index]) return;
                seen[index] = true;
                var n = number(port, 'rx_bytes-r');
                if (n !== null) { sum += n; count++; }
            });
            if (!count && String(device.type || '').toLowerCase() === 'uap') {
                var uplink = number(device.uplink, 'rx_bytes-r');
                if (uplink !== null) { sum = uplink; count = 1; }
            }
            if (!count) throw 'No physical-port RX rate is available.';
            return sum * 8;
          error_handler: DISCARD_VALUE
        master_item:
          key: unifi.devices.json
        tags:
        - tag: component
          value: topology-traffic
        - tag: direction
          value: rx
      - uuid: d528628a48ed41a18abb2abc5de63a1d
        name: 'UniFi device [{#UNIFI.NAME}]: RX byte counter'
        type: DEPENDENT
        key: unifi.device.rx.counter.bytes[{#UNIFI.MAC}]
        history: 1h
        value_type: UNSIGNED
        trends: '0'
        units: B
        description: Sum of cumulative RX byte counters across unique physical ports. Used only as the source for the rate
          fallback when rx_bytes-r is absent.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |-
